name: Feature request
description: Suggest a new card operation, deck, game helper or improvement.
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/SimpleProgrammingAU/deckshoes/blob/main/ROADMAP.md) first; it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the game or use case, not just the API you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: How you'd like to call it, ideally as a short example.
      render: ts
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives you've considered
